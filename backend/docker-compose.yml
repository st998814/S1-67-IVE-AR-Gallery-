services:
  db:
    image: postgres:16
    container_name: ive-ar-gallery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ive_ar_gallery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ive_ar_gallery"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ive_ar_gallery_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
    container_name: ive-ar-gallery-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-5050}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5050}
      DB_HOST: ${DOCKER_DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ive_ar_gallery}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      UPLOAD_FOLDER: /app/uploads
    ports:
      - "5050:5050"
    volumes:
      - ive_ar_gallery_uploads:/app/uploads

volumes:
  ive_ar_gallery_pgdata:
  ive_ar_gallery_uploads:
