services:
  db:
    image: postgres:16
    container_name: ive-ar-gallery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ive_ar_gallery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ive_ar_gallery"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ive_ar_gallery_pgdata:/var/lib/postgresql/data

volumes:
  ive_ar_gallery_pgdata:
